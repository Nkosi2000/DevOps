<div class="container">
  <!-- Shared track for developer and operator -->
  <div class="track">
    <div class="railway-line"></div>

    <!-- Developer character -->
    <div class="character developer" [ngClass]="developerActive ? 'active' : ''">
      👨‍💻 <!-- Developer Icon -->
    </div>

    <!-- DevOps Lifecycle Stages for Developer -->
    <div class="stage" [ngClass]="currentStage === 'plan' ? 'active' : ''">
      <span class="icon">📝</span> Plan
    </div>
    <div class="stage" [ngClass]="currentStage === 'code' ? 'active' : ''">
      <span class="icon">💻</span> Code
    </div>
    <div class="stage" [ngClass]="currentStage === 'build' ? 'active' : ''">
      <span class="icon">🏗️</span> Build
    </div>
    <div class="stage" [ngClass]="currentStage === 'test' ? 'active' : ''">
      <span class="icon">✅</span> Test
    </div>

    <!-- Operator character -->
    <div class="character operator" [ngClass]="operatorActive ? 'active' : ''">
      👷‍♂️ <!-- Operator Icon -->
    </div>

    <!-- DevOps Lifecycle Stages for Operator -->
    <div class="stage" [ngClass]="currentStage === 'release' ? 'active' : ''">
      <span class="icon">🚀</span> Release
    </div>
    <div class="stage" [ngClass]="currentStage === 'deploy' ? 'active' : ''">
      <span class="icon">🔧</span> Deploy
    </div>
    <div class="stage" [ngClass]="currentStage === 'operate' ? 'active' : ''">
      <span class="icon">👨‍🏭</span> Operate
    </div>
    <div class="stage" [ngClass]="currentStage === 'monitor' ? 'active' : ''">
      <span class="icon">📈</span> Monitor
    </div>
  </div>
</div>
